[project]
name = "analysis-cookbooks-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
    "uvicorn[standard]>=0.44.0",
    "pyjwt>=2.12.1",
    "pwdlib[argon2]>=0.3.0",
    "python-multipart>=0.0.20",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = []

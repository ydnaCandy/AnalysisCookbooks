services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached          # プロジェクトルートをコンテナにマウント
      - uv-cache:/home/vscode/.cache/uv  # uvのキャッシュを永続化（依存関係の再ダウンロードを防ぐ）
      # 注意: Claude Codeの設定（~/.claude）は devcontainer.json の mounts で管理
    command: sleep infinity
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/analysis_cookbooks
    depends_on:
      db:
        condition: service_healthy  # DBのヘルスチェック通過後にappを起動
    ports:
      - "8000:8000"   # FastAPI
      - "5173:5173"   # Vite

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analysis_cookbooks
    volumes:
      - postgres-data:/var/lib/postgresql/data  # DBデータを永続化（コンテナ削除後も保持）
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

# 名前付きボリューム一覧
# ※ Claude Codeの設定ボリューム（claude-code-config-*）は devcontainer.json で定義
volumes:
  postgres-data:  # PostgreSQLのデータ永続化
  uv-cache:       # uvパッケージキャッシュ
